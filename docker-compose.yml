services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: GestionOrdinateursDb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    command: start-dev
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - appnet

  authentification-api:
    image: ${DOCKER_ACCOUNT}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    container_name: authentification_api
    ports:
      - "5157:5157"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5157
    depends_on:
      - postgres
      - keycloak
    networks:
      - appnet

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT}/gestionordinateursapi:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    container_name: gestionordinateurs_api
    ports:
      - "5025:5025"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5025
    depends_on:
      - postgres
    networks:
      - appnet

  gestionordinateurs-gateway:
    image: ${DOCKER_ACCOUNT}/gestionordinateursgateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    container_name: gestionordinateurs_gateway
    ports:
      - "5010:5010"
    depends_on:
      - gestionordinateurs-api
    networks:
      - appnet

  gestionordinateurs-client:
    image: ${DOCKER_ACCOUNT}/gestionordinateursclient:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    container_name: gestionordinateurs_client
    ports:
      - "5000:5000"
    depends_on:
      - gestionordinateurs-gateway
      - authentification-api
    networks:
      - appnet


volumes:
  postgres_data:
  keycloak_data:


networks:
  appnet: